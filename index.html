<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Meal Plan & Groceries</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#23241f; --muted:#6b6f68;
    --accent:#2f7d5b; --accent-soft:#e3f0e9; --line:#e6e4dd;
    --warn-bg:#fff4e0; --warn-ink:#8a5a12; --warn-line:#f0d9a8;
    --lunch-bg:#eef4fb; --lunch-ink:#34597e; --lunch-line:#cfe0f1;
    --header-bg:var(--accent); --tab-on:#ffffff;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16170f; --card:#22241c; --ink:#ececdf; --muted:#a3a89b;
      --accent:#7fcaa3; --accent-soft:#23362c; --line:#34372c;
      --warn-bg:#3a2f17; --warn-ink:#f0cd87; --warn-line:#5a4a23;
      --lunch-bg:#1d2a39; --lunch-ink:#a9cdef; --lunch-line:#33485f;
      --header-bg:#1b2018; --tab-on:#16170f;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:48px}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  header{background:var(--header-bg);color:#fff;padding:calc(18px + env(safe-area-inset-top,0)) 14px 16px}
  header .wrap{padding:0 4px}
  header h1{margin:0;font-size:1.22rem;letter-spacing:.2px}
  header .sub{opacity:.9;font-size:.85rem;margin-top:2px}
  .tabs{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;padding:8px 14px}
  .tabs button{flex:1;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.98rem;font-weight:600;padding:11px 8px;border-radius:12px;cursor:pointer;transition:.15s}
  .tabs button .count{font-weight:600;opacity:.75;font-size:.82em}
  .tabs button[aria-selected="true"]{background:var(--accent);color:var(--tab-on);border-color:var(--accent);box-shadow:0 2px 8px rgba(47,125,91,.25)}
  main{padding-top:14px}
  .panel{display:none}.panel.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .callout{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.92rem;color:var(--muted)}
  .callout b{color:var(--ink)} .weekof{font-weight:600;color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .day-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  .day-h .day{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
  .day-h .dish{font-size:1.16rem;font-weight:700}
  .day-h .dish .dish-sides{font-weight:500;color:var(--muted)}
  .meal-photo{display:block;width:100%;max-height:210px;object-fit:cover;border-radius:12px;margin:10px 0 2px;border:1px solid var(--line)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;align-items:center}
  .pill{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .pill.polo{background:#fde9ef;color:#b03a63}
  @media (prefers-color-scheme: dark){.pill.polo{background:#3a2330;color:#f0a8c4}}
  .optline{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
  .swapbtn{appearance:none;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;padding:8px 13px;border-radius:10px;cursor:pointer}
  .swapbtn:active{transform:scale(.97)}
  .optdots{font-size:.78rem;color:var(--muted)}
  .likebtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:.85rem;padding:8px 13px;border-radius:10px;cursor:pointer}
  .likebtn:active{transform:scale(.97)}
  .likebtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .compbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:.85rem;padding:8px 13px;border-radius:10px;cursor:pointer}
  .compbtn:active{transform:scale(.97)}
  .compbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .puntbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:.85rem;padding:8px 13px;border-radius:10px;cursor:pointer}
  .puntbtn:active{transform:scale(.97)}
  .puntbtn[aria-pressed="true"]{border-color:var(--warn-line);color:var(--warn-ink);background:var(--warn-bg)}
  .neverbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:.85rem;padding:8px 13px;border-radius:10px;cursor:pointer}
  .neverbtn:active{transform:scale(.97)}
  .neverbtn[aria-pressed="true"]{border-color:#d9534f;color:#c0392b;background:#fbe6e4}
  @media (prefers-color-scheme: dark){.neverbtn[aria-pressed="true"]{border-color:#7a3330;color:#f0a8a2;background:#3a201e}}
  .card.is-never{opacity:.72}
  .never-tag{display:inline-block;font-size:.72rem;font-weight:700;color:#c0392b;background:#fbe6e4;border-radius:999px;padding:2px 9px;margin-left:2px}
  @media (prefers-color-scheme: dark){.never-tag{color:#f0a8a2;background:#3a201e}}
  .pill.comp{background:var(--accent-soft);color:var(--accent)}
  .reqbtn{appearance:none;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:.8rem;padding:7px 11px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
  .card h4{margin:14px 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .step-group{margin:6px 0 0}
  .step-part{margin:12px 0 0;font-size:.86rem;font-weight:700;color:var(--accent)}
  .step-group ol{margin-top:3px}
  .card p{margin:6px 0}.card ol,.card ul{margin:6px 0;padding-left:22px}.card li{margin:3px 0}
  .swap{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.9rem}
  .lunch{background:var(--lunch-bg);border:1px solid var(--lunch-line);color:var(--lunch-ink);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.9rem}
  .lunch b{color:var(--lunch-ink)}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 14px;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--card)}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--accent-soft);color:var(--accent);font-size:.74rem;text-transform:uppercase;letter-spacing:.4px}
  tr:last-child td{border-bottom:none}
  h2.sec{font-size:1.05rem;margin:22px 2px 10px}
  .grocery-cat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 4px;margin:0 0 12px;overflow:hidden}
  .grocery-cat > h3{margin:0;padding:11px 12px;font-size:.82rem;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
  .item{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
  .item input{appearance:none;flex:0 0 auto;width:24px;height:24px;margin-top:1px;border:2px solid var(--accent);border-radius:7px;background:var(--card);position:relative;cursor:pointer;transition:.12s}
  .item input:checked{background:var(--accent)}
  .item input:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
  .item .txt{flex:1}.item .txt .name{font-weight:600;display:block}.item .txt .det{font-size:.82rem;color:var(--muted);margin-top:1px}
  .item input:checked ~ .txt{opacity:.5}.item input:checked ~ .txt .name{text-decoration:line-through}
  .infobox{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.88rem;color:var(--muted)}
  .infobox b{color:var(--ink)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 12px}
  .toolbar .progress{font-size:.85rem;color:var(--muted)}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:600;font-size:.85rem;padding:8px 14px;border-radius:10px;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .hcontrols{display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px}
  .hmenu-wrap{position:relative}
  .hbtn{appearance:none;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;font-size:1rem;font-weight:700;min-width:42px;height:42px;padding:0 11px;border-radius:12px;cursor:pointer;line-height:1}
  .hbtn:active{transform:scale(.95)}
  .hbtn[aria-pressed="true"]{background:#fff;color:var(--accent)}
  .apptitle{text-align:center;margin:2px 0 0}
  header .sub{text-align:center}
  /* Easy-read mode: dyslexia / ADHD-friendly typography */
  body.easyread{font-family:"Atkinson Hyperlegible","Verdana","Tahoma","Segoe UI",sans-serif;line-height:1.9;letter-spacing:.02em;word-spacing:.06em}
  body.easyread .card p,body.easyread .card li,body.easyread .lunch,body.easyread .swap,body.easyread .item .txt .name{font-size:1.06rem}
  body.easyread em{font-style:normal;font-weight:600}
  body.easyread .card ol,body.easyread .card ul{padding-left:24px}
  body.easyread .card li{margin:6px 0}
  .theme-menu{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:8px;z-index:30;min-width:180px}
  .theme-menu .theme-opt{display:flex;align-items:center;gap:11px;width:100%;appearance:none;border:none;background:transparent;color:var(--ink);font-size:.95rem;font-weight:600;padding:11px 10px;border-radius:10px;cursor:pointer;text-align:left}
  .theme-menu .theme-opt:active{background:var(--accent-soft)}
  .theme-menu .dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
  .theme-menu .theme-opt[aria-current="true"]{background:var(--accent-soft)}
  .theme-menu .theme-opt[aria-current="true"]::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:800}
  footer{text-align:center;color:var(--muted);font-size:.78rem;margin:26px 0 8px;padding:0 14px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hcontrols">
    <button id="easyBtn" class="hbtn" aria-label="Easy-read mode" aria-pressed="false" title="Easy-read mode (dyslexia / ADHD friendly)">Aa</button>
    <div class="hmenu-wrap">
      <button id="themeBtn" class="hbtn" aria-label="Change color theme" title="Change color theme">🎨</button>
      <div id="themeMenu" class="theme-menu" hidden></div>
    </div>
  </div>
  <h1 class="apptitle">🍽️ Weekly Meal Plan &amp; Groceries</h1>
  <div class="sub">Family of 3 · <span id="weekof-h">this week</span></div>
</div></header>

<nav class="tabs" role="tablist">
  <button id="tab-plan" role="tab" aria-selected="true">📅 Meal Plan</button>
  <button id="tab-grocery" role="tab" aria-selected="false">🛒 Groceries <span class="count" id="grocery-count"></span></button>
</nav>

<main class="wrap">
  <section class="panel active" id="panel-plan" role="tabpanel"></section>
  <section class="panel" id="panel-grocery" role="tabpanel"></section>
</main>

<footer>Tap 🔄 Swap on any dinner to change it — the grocery list updates to match. Checkmarks save on this device.</footer>

var CAT_ORDER = ["Meat & Seafood","Produce","Dairy & Eggs","Bread & Bakery","Pantry","Spices"];
var V = WEEK.version;
/* Shared decisions pulled from the repo JSONs on load (see mpLoadShared) so likes,
   punts and never-again made on ANY device show up here too. Updated by the weekly
   job from the Google Form, so this reflects everyone's choices after each sync. */
var SHARED = { likes:{}, punts:{}, never:{} };
function esc(s){return (s||"").replace(/&(?!\w+;)/g,"&amp;");}
function mpImgFallback(img){ if(img.src.slice(-4)==='.jpg'){ img.src=img.src.slice(0,-4)+'.png'; } else { img.remove(); } }
function mpGetLikes(){ try{ return JSON.parse(localStorage.getItem('mp:likes')||'{}'); }catch(e){ return {}; } }
function mpIsLiked(slug){ return !!mpGetLikes()[slug] || !!SHARED.likes[slug]; }
function mpToggleLike(slug,title){ var o=mpGetLikes(); if(o[slug]){ delete o[slug]; } else { o[slug]=title; } try{ localStorage.setItem('mp:likes', JSON.stringify(o)); }catch(e){} }
function mpGetPunts(){ try{ return JSON.parse(localStorage.getItem('mp:punts')||'{}'); }catch(e){ return {}; } }
function mpIsPunted(slug){ return !!mpGetPunts()[slug] || !!SHARED.punts[slug]; }
function mpSetPunt(slug,title,on){ var o=mpGetPunts(); if(on){ o[slug]=title; } else { delete o[slug]; } try{ localStorage.setItem('mp:punts', JSON.stringify(o)); }catch(e){} }
function mpGetNever(){ try{ return JSON.parse(localStorage.getItem('mp:never')||'{}'); }catch(e){ return {}; } }
function mpIsNever(slug){ return !!mpGetNever()[slug] || !!SHARED.never[slug]; }
function mpSetNever(slug,title,on){ var o=mpGetNever(); if(on){ o[slug]=title; } else { delete o[slug]; } try{ localStorage.setItem('mp:never', JSON.stringify(o)); }catch(e){} }
function isCompany(m){ if(!m||!m.company) return false; try{ return localStorage.getItem('mp:company:'+m.id)==='1'; }catch(e){ return false; } }
function setCompany(id,on){ try{ localStorage.setItem('mp:company:'+id, on?'1':'0'); }catch(e){} }
function scaleQty(q,f){ var m=String(q).match(/^(~?)(\d+(?:\.\d+)?)(.*)$/); if(!m) return q+' ×'+f; var n=Math.round(parseFloat(m[2])*f*100)/100; return m[1]+n+m[3]; }
function mpToast(msg){ var t=document.getElementById('mpToast'); if(!t){ t=document.createElement('div'); t.id='mpToast'; t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23241f;color:#fff;padding:11px 16px;border-radius:10px;font-size:.9rem;z-index:100;opacity:0;transition:.25s;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)'; document.body.appendChild(t); } t.textContent=msg; t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(function(){ t.style.opacity='0'; }, 3000); }
function mpCopyLikes(){
  var o=mpGetLikes(), keys=Object.keys(o);
  if(!keys.length){ mpToast('Tap ♥ Like on a few meals first, then copy.'); return; }
  var text='Meal-plan likes: '+JSON.stringify(o);
  function ok(){ mpToast('Copied your '+keys.length+' favorite'+(keys.length>1?'s':'')+' — paste into your meal-plan chat.'); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, function(){ mpToast(text); }); }
  else { mpToast(text); }
}
function getOpt(id){ try{var v=localStorage.getItem("opt:"+V+":"+id);return v?(+v):0;}catch(e){return 0;} }
function setOpt(id,i){ try{localStorage.setItem("opt:"+V+":"+id,String(i));}catch(e){} }
function active(meal){ return meal.options[ getOpt(meal.id) % meal.options.length ]; }

/* ---- Meal Plan tab ---- */
function renderPlan(){
  var p = document.getElementById('panel-plan');
  var h = '';
  h += '<div class="callout"><div><span class="weekof">Week of:</span> '+esc(WEEK.label)+'</div>'+
       '<p style="margin:8px 0 0"><b>This week:</b> '+esc(WEEK.intro)+'</p></div>';

  // At a glance
  h += '<div class="table-scroll"><table><thead><tr><th>Day</th><th>Dinner</th><th>Protein</th><th>Time</th><th>Next-Day Lunch</th></tr></thead><tbody>';
  WEEK.meals.forEach(function(m){
    var o = active(m);
    h += '<tr><td>'+m.day.slice(0,3)+'</td><td>'+esc(o.title)+(o.sides?' with '+esc(o.sides):'')+'</td><td>'+esc(o.protein)+'</td><td>'+esc(o.time)+'</td><td>'+esc(o.lunchTitle||'—')+'</td></tr>';
  });
  h += '</tbody></table></div>';

  // Day cards
  WEEK.meals.forEach(function(m){
    var idx = getOpt(m.id)%m.options.length, o = m.options[idx], n = m.options.length;
    var slug = (o.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    var neverOn = mpIsNever(slug);
    h += '<article class="card'+(neverOn?' is-never':'')+'">';
    h += '<div class="day-h"><span class="day">'+m.day+'</span><span class="dish">'+esc(o.title)+(o.sides?' <span class="dish-sides">with '+esc(o.sides)+'</span>':'')+(neverOn?' <span class="never-tag">🚫 won\'t suggest again</span>':'')+'</span></div>';
    var imgsrc = o.img || ('images/'+(o.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')+'.jpg');
    h += '<img class="meal-photo" src="'+esc(imgsrc)+'" alt="'+esc(o.title)+'" loading="lazy" onerror="mpImgFallback(this)">';
    h += '<div class="meta"><span class="pill">'+esc(o.protein)+'</span><span class="pill">'+esc(o.time)+'</span>'+(m.polo?'<span class="pill polo">Polo night</span>':'')+((m.company&&isCompany(m))?'<span class="pill comp">👥 Cooking for 6</span>':'')+'</div>';
    h += '<div class="optline">'+
         (n>1?'<button class="swapbtn" data-swap="'+m.id+'">🔄 Swap dinner</button>':'')+
         (m.company?'<button class="compbtn" data-company="'+m.id+'" aria-pressed="'+(isCompany(m)?'true':'false')+'">'+(isCompany(m)?'👥 For 6':'👥 For 3')+'</button>':'')+
         '<button class="likebtn" data-like="'+slug+'" data-title="'+esc(o.title)+'" aria-pressed="false">♡ Like</button>'+
         '<button class="puntbtn" data-punt="'+m.id+'" data-pslug="'+slug+'" data-ptitle="'+esc(o.title)+'" aria-pressed="false" title="Skip this dish this week, save it for next week">⏭ Punt</button>'+
         '<button class="neverbtn" data-never="'+m.id+'" data-nslug="'+slug+'" data-ntitle="'+esc(o.title)+'" aria-pressed="false" title="Never suggest this dish again">🚫 Never</button>'+
         (n>1?'<span class="optdots">Option '+(idx+1)+' of '+n+'</span>':'')+'</div>';
    h += '<p><b>What\'s included:</b> '+esc(o.included)+'</p>';
    if(o.swapNote) h += '<div class="swap">⚠️ <b>Teen-friendly:</b> '+o.swapNote+'</div>';
    h += '<h4>How to make it ('+esc(o.time)+')</h4>';
    if(o.steps && o.steps.length && typeof o.steps[0]==='string'){
      h += '<ol>'; o.steps.forEach(function(s){ h += '<li>'+esc(s)+'</li>'; }); h += '</ol>';
    } else if(o.steps){
      o.steps.forEach(function(g){
        h += '<div class="step-group"><h5 class="step-part">'+esc(g.part)+'</h5><ol>';
        (g.do||[]).forEach(function(s){ h += '<li>'+esc(s)+'</li>'; });
        h += '</ol></div>';
      });
    }
    h += '<h4>Ingredients</h4><ul>';
    o.groceries.forEach(function(g){ h += '<li>'+esc(g.name)+'</li>'; });
    h += '</ul>';
    if(o.lunch) h += '<div class="lunch">🥡 <b>Next-day lunch → '+esc(o.lunchTitle)+'.</b> '+esc(o.lunch)+'</div>';
    h += '</article>';
  });

  h += '<h2 class="sec">Protein Spread</h2><div class="table-scroll"><table><thead><tr>';
  WEEK.meals.forEach(function(m){ h += '<th>'+m.day.slice(0,3)+'</th>'; });
  h += '</tr></thead><tbody><tr>';
  WEEK.meals.forEach(function(m){ h += '<td>'+esc(active(m).protein)+'</td>'; });
  h += '</tr></tbody></table></div><p style="font-size:.88rem;color:var(--muted);margin:0 2px">Swaps keep each night\'s protein, so the weekly variety stays intact ✓</p>';

  p.innerHTML = h;
  p.querySelectorAll('[data-swap]').forEach(function(b){
    b.addEventListener('click', function(){
      var id=b.getAttribute('data-swap'), m=WEEK.meals.filter(function(x){return x.id===id;})[0];
      setOpt(id, (getOpt(id)+1)%m.options.length);
      renderPlan(); renderGrocery();
    });
  });
  p.querySelectorAll('[data-like]').forEach(function(b){
    var slug=b.getAttribute('data-like');
    function paint(){ var on=mpIsLiked(slug); b.setAttribute('aria-pressed', on?'true':'false'); b.textContent=on?'♥ Liked':'♡ Like'; }
    paint();
    b.addEventListener('click', function(){ mpToggleLike(slug, b.getAttribute('data-title')); paint(); });
  });
  p.querySelectorAll('[data-punt]').forEach(function(b){
    var slug=b.getAttribute('data-pslug');
    function paint(){ var on=mpIsPunted(slug); b.setAttribute('aria-pressed', on?'true':'false'); b.textContent=on?'⏭ Punted → next week':'⏭ Punt'; }
    paint();
    b.addEventListener('click', function(){
      var id=b.getAttribute('data-punt'), title=b.getAttribute('data-ptitle');
      var m=WEEK.meals.filter(function(x){return x.id===id;})[0];
      var on=!mpIsPunted(slug);
      mpSetPunt(slug, title, on);
      if(on){
        if(m.options.length>1){ setOpt(id, (getOpt(id)+1)%m.options.length); mpToast('Punted "'+title+'" — saved for next week. Showing another option for this week.'); }
        else { mpToast('Punted "'+title+'" — saved for next week.'); }
        mpPushPrefs(true);
      } else {
        mpToast('Un-punted "'+title+'".');
      }
      renderPlan(); renderGrocery();
    });
  });
  p.querySelectorAll('[data-never]').forEach(function(b){
    var slug=b.getAttribute('data-nslug');
    function paint(){ var on=mpIsNever(slug); b.setAttribute('aria-pressed', on?'true':'false'); b.textContent=on?'🚫 Won\'t suggest':'🚫 Never'; }
    paint();
    b.addEventListener('click', function(){
      var id=b.getAttribute('data-never'), title=b.getAttribute('data-ntitle');
      var m=WEEK.meals.filter(function(x){return x.id===id;})[0];
      var on=!mpIsNever(slug);
      mpSetNever(slug, title, on);
      if(on){
        if(m.options.length>1){ setOpt(id, (getOpt(id)+1)%m.options.length); mpToast('Got it — won\'t suggest "'+title+'" again. Showing another option for this week.'); }
        else { mpToast('Got it — won\'t suggest "'+title+'" again.'); }
        mpPushPrefs(true);
      } else {
        mpToast('"'+title+'" is back in the rotation.');

  p.querySelectorAll('[data-company]').forEach(function(b){
    b.addEventListener('click', function(){
      var id=b.getAttribute('data-company'), m=WEEK.meals.filter(function(x){return x.id===id;})[0];
      setCompany(id, !isCompany(m));
      renderPlan(); renderGrocery();

}

/* ---- Grocery tab ---- */
function collectGroceries(){
  var items=[];
  WEEK.meals.forEach(function(m){
    var idx=getOpt(m.id)%m.options.length, comp=isCompany(m);
    active(m).groceries.forEach(function(g,gi){
      var name=g.name;
      if(comp){ var d=name.indexOf(" — "); if(d>=0){ name=name.slice(0,d)+" — "+scaleQty(name.slice(d+3),2); } }
      items.push({name:name,det:(g.det||'')+(comp?" · for 6":""),cat:g.cat,key:"gro:"+V+":"+m.id+":"+idx+":"+gi+(comp?":c":"")});
    });
  });
  (WEEK.staples||[]).forEach(function(g,gi){ items.push({name:g.name,det:g.det,cat:g.cat,key:"gro:"+V+":staple:"+gi}); });
  return items;
}
function uniqArr(a){ var seen={},r=[]; a.forEach(function(x){ if(!seen[x]){seen[x]=1;r.push(x);} }); return r; }
function combineQtys(qtys){
  if(!qtys.length) return "";
  if(qtys.length===1) return qtys[0];
  var nums=[], unit=null, ok=true;
  for(var i=0;i<qtys.length;i++){
    var m=qtys[i].match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
    if(!m){ ok=false; break; }
    nums.push(parseFloat(m[1]));
    var u=(m[2]||"").trim().toLowerCase();
    if(unit===null) unit=u; else if(unit!==u){ ok=false; break; }
  }
  if(ok){ var sum=nums.reduce(function(a,b){return a+b;},0); return (Math.round(sum*100)/100)+(unit?" "+unit:""); }
  return qtys.join(" + ");
}
function mergeGroceries(items){
  var map={}, order=[];
  items.forEach(function(it){
    var d=it.name.indexOf(" — ");
    var base=d>=0?it.name.slice(0,d).trim():it.name.trim();
    var qty=d>=0?it.name.slice(d+3).trim():"";
    var gk=it.cat+"||"+base.toLowerCase();
    if(!map[gk]){ map[gk]={base:base,cat:it.cat,qtys:[],dets:[]}; order.push(gk); }
    if(qty) map[gk].qtys.push(qty);
    if(it.det) map[gk].dets.push(it.det);
  });
  return order.map(function(gk){
    var g=map[gk], q=combineQtys(g.qtys);
    return { name:g.base+(q?" — "+q:""), det:uniqArr(g.dets).join(" · "), cat:g.cat, key:"grom:"+V+":"+gk };
  });
}
function renderGrocery(){
  var p=document.getElementById('panel-grocery'), items=mergeGroceries(collectGroceries());
  var h='';
  h += '<div class="callout"><div><span class="weekof">Week of:</span> '+esc(WEEK.label)+'</div>'+
       '<p style="margin:8px 0 0">Covers all dinners + a next-day lunch from each. Updates automatically when you swap a dinner. Pantry staples (oil, salt, pepper, soy sauce) assumed on hand.</p></div>';
  h += '<div class="toolbar"><span class="progress" id="progress"></span><div style="display:flex;gap:8px"><button class="btn" id="filter">Hide found</button><button class="btn" id="reset">Reset list</button></div></div>';

  CAT_ORDER.forEach(function(cat){
    var inCat=items.filter(function(it){return it.cat===cat;});
    if(!inCat.length) return;
    h += '<div class="grocery-cat"><h3>'+esc(cat)+'</h3>';
    inCat.forEach(function(it){
      h += '<label class="item"><input type="checkbox" data-key="'+it.key+'"><span class="txt"><span class="name">'+esc(it.name)+'</span>'+(it.det?'<span class="det">'+esc(it.det)+'</span>':'')+'</span></label>';
    });
    h += '</div>';
  });
  h += '<div class="infobox"><b>Already have (don\'t buy):</b> olive oil, salt, pepper, neutral cooking oil — assumed stocked.</div>';
  p.innerHTML=h;

  var boxes=Array.prototype.slice.call(p.querySelectorAll('.item input'));
  function prog(){
    var done=boxes.filter(function(b){return b.checked;}).length;
    document.getElementById('progress').textContent=done+' of '+boxes.length+' checked';
    var c=document.getElementById('grocery-count'); c.textContent=done>0?'('+done+'/'+boxes.length+')':'';
  }
  boxes.forEach(function(b){
    var k=b.getAttribute('data-key');
    try{ if(localStorage.getItem(k)==='1') b.checked=true; }catch(e){}
    b.addEventListener('change',function(){ try{localStorage.setItem(k,b.checked?'1':'0');}catch(e){} prog(); applyFilter(); });
  });
  document.getElementById('reset').addEventListener('click',function(){
    boxes.forEach(function(b){ b.checked=false; try{localStorage.removeItem(b.getAttribute('data-key'));}catch(e){} });
    prog(); applyFilter();
  });

  // "Hide found" filter — show only items still to pick up
  var FILTER_KEY='mp:filter', filterBtn=document.getElementById('filter');
  function filterOn(){ try{return localStorage.getItem(FILTER_KEY)==='1';}catch(e){return false;} }
  function applyFilter(){
    var on=filterOn();
    filterBtn.textContent = on ? 'Show all' : 'Hide found';
    boxes.forEach(function(b){ var l=b.closest('.item'); if(l) l.style.display=(on && b.checked)?'none':''; });
    p.querySelectorAll('.grocery-cat').forEach(function(cat){
      var anyVisible=Array.prototype.slice.call(cat.querySelectorAll('.item')).some(function(l){return l.style.display!=='none';});
      cat.style.display=anyVisible?'':'none';
    });
  }
  filterBtn.addEventListener('click',function(){
    try{ localStorage.setItem(FILTER_KEY, filterOn()?'0':'1'); }catch(e){}
    applyFilter();
  });

  prog(); applyFilter();
}

var THEME_ORDER = ["terracotta","green","slate","berry","charcoal","niners"];
var THEME_KEYS = ["--bg","--card","--ink","--muted","--accent","--accent-soft","--line","--warn-bg","--warn-ink","--warn-line","--lunch-bg","--lunch-ink","--lunch-line","--header-bg","--tab-on"];
function applyTheme(name){
  var t = THEMES[name] || THEMES.terracotta, root = document.documentElement;
  if(t.vars){ THEME_KEYS.forEach(function(k){ root.style.setProperty(k, t.vars[k]); }); }
  else { THEME_KEYS.forEach(function(k){ root.style.removeProperty(k); }); }
  try{ localStorage.setItem("mp:theme", name); }catch(e){}
  var meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute("content", t.dot);
  var menu=document.getElementById("themeMenu");
  if(menu){ Array.prototype.forEach.call(menu.querySelectorAll(".theme-opt"), function(b){ b.setAttribute("aria-current", b.getAttribute("data-theme")===name?"true":"false"); }); }
}
(function initTheme(){
  var btn=document.getElementById("themeBtn"), menu=document.getElementById("themeMenu");
  menu.innerHTML = THEME_ORDER.map(function(k){ return '<button class="theme-opt" data-theme="'+k+'"><span class="dot" style="background:'+THEMES[k].dot+'"></span>'+THEMES[k].name+'</button>'; }).join("");
  Array.prototype.forEach.call(menu.querySelectorAll(".theme-opt"), function(b){
    b.addEventListener("click", function(){ applyTheme(b.getAttribute("data-theme")); menu.hidden=true; });
  });
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.hidden=!menu.hidden; });
  document.addEventListener("click", function(e){ if(!menu.hidden && !menu.contains(e.target) && e.target!==btn) menu.hidden=true; });
  var saved="terracotta"; try{ var s=localStorage.getItem("mp:theme"); if(s && THEMES[s]) saved=s; }catch(e){}
  applyTheme(saved);
})();

(function initEasy(){

/* ---- Sync likes + punts + never-again from the device to the planner's Google Form ----
   Payload shape v3: {"v":3,"likes":{slug:title},"punts":{slug:title},"never":{slug:title}}.
   The reader should: if parsed.v>=3 use likes/punts/never; if v===2 use likes/punts (never={});
   else treat the whole object as the likes map (back-compat with older bare-likes posts).
   Likes push at most weekly; a punt or a never force-pushes immediately (time-sensitive). */
var LIKES_ENDPOINT = "https://docs.google.com/forms/d/e/1FAIpQLSfMMMtBfjUps2tDzBaMx98QPgINR__d39Io9Gh1NlUzZ55KLA/formResponse";
var LIKES_ENTRY = "entry.1875468196";
function mpPushPrefs(force){
  if(!LIKES_ENDPOINT || !LIKES_ENTRY) return;            // not configured yet — no-op
  var likes = mpGetLikes(), punts = mpGetPunts(), never = mpGetNever();
  if(!Object.keys(likes).length && !Object.keys(punts).length && !Object.keys(never).length) return;
  var WEEK_MS = 7*24*3600*1000, now = Date.now(), last = 0;
  try{ last = +(localStorage.getItem('mp:push:lastpush')||localStorage.getItem('mp:likes:lastpush')||0); }catch(e){}
  if(!force && now - last < WEEK_MS) return;             // weekly cadence unless forced (punt/never)
  var fd = new FormData(); fd.append(LIKES_ENTRY, JSON.stringify({v:3, likes:likes, punts:punts, never:never}));
  fetch(LIKES_ENDPOINT, {method:'POST', mode:'no-cors', body:fd})
    .then(function(){ try{ localStorage.setItem('mp:push:lastpush', String(Date.now())); }catch(e){} })
    .catch(function(){});
}
mpPushPrefs(false);

/* ---- Pull shared decisions (everyone's likes/punts/never) from the repo JSONs ----
   These files are refreshed weekly by the planner job from the Google Form responses,
   so a like/never made on one phone shows on all phones after the next sync. Best-effort:
   missing files or offline just leave SHARED empty and the UI falls back to this device. */
function mpLoadShared(){
  var jobs = [['likes.json','liked','likes'], ['punts.json','punted','punts'], ['never.json','never','never']];
  Promise.all(jobs.map(function(j){
    return fetch(j[0]+'?v='+encodeURIComponent(V)).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
  })).then(function(res){
    var changed=false;
    res.forEach(function(d,i){ if(d && d[jobs[i][1]] && typeof d[jobs[i][1]]==='object'){ SHARED[jobs[i][2]]=d[jobs[i][1]]; changed=true; } });
    if(changed){ renderPlan(); renderGrocery(); }
  }).catch(function(){});
}

/* ---- Punts auto-clear on a new week ---- */
/* Punts mean "add NEXT week." Once a new week's plan loads (version changed), the punts
   have been honored, so clear them on the device — otherwise they'd keep re-syncing. */
(function clearStalePunts(){
  try{
    if(localStorage.getItem('mp:punts:ver') !== V){
      localStorage.removeItem('mp:punts');
      localStorage.setItem('mp:punts:ver', V);
    }
  }catch(e){}
})();
